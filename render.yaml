services:
  - type: web
    name: flowmail-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: sh docker-entrypoint.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: FLOWMAIL_DB_PATH
        value: /tmp/mailbox.db
      - key: REQUIRE_API_KEY
        value: "true"
      - key: RELAYBOX_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_PASSCODE
        generateValue: true
      - key: WEBHOOK_INBOUND_SECRET
        generateValue: true
